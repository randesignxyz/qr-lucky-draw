:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  margin: 0;

  font-size: var(--font-size-base);

  font-weight: var(--font-weight-normal);
}

.cursor-interaction {

}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);

  text-decoration: none;
  text-underline-offset: 2px;
  font-weight: inherit;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}
p,

h2,
h3,
h4,
h5,
h6,
li,

}

h1 {

}

h2 {
  font-size: calc(var(--font-size-base) * 1.25);
  line-height: 1.4;
}
h3 {

}
h4 {

}
h5,
h6 {
  font-size: var(--font-size-base);
  line-height: calc(var(--font-size-base) * 1.625);
}

h1,
h2,
h3,
h4,
h5,
h6,
b,
strong,

}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}
pre,
pre code {
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 20px;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  color: var(--foreground);
  font: inherit;
  text-align: start;
  border-collapse: separate;
  border-spacing: 0;
  font-size: calc(var(--font-size-base) * 0.875);
  line-height: calc(var(--font-size-base) * 1.625);
  font-family: var(--font-sans);
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
  border-bottom-color: color-mix(in srgb, var(--foreground) 5%, transparent);
}
.table :is(th, td):not(:last-child) {
  padding-inline-end: calc(var(--font-size-base) * 1.5);
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead :is(th, td) {
  border-bottom-color: var(--border-strong, var(--input));
  padding-block: calc(var(--font-size-base) / 2);
  line-height: var(--font-size-base);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}
.table tbody :is(th, td) {
  padding-block: calc(var(--font-size-base) * 0.625);
}

.table.table-sm :is(th, td) {
  padding-block: 8px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget > :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  border: 1px solid var(--border);
  corner-shape: var(--corner-shape);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
  font-family: var(--font-sans);
  padding: 5px 12px;
  border-color: color-mix(
    in oklab,
    light-dark(var(--primary-foreground), var(--foreground)) 5%,
    transparent
  );
  border-radius: var(--radius-2xl);
  color: light-dark(var(--primary-foreground), var(--foreground));
  background: light-dark(var(--foreground), var(--popover));
  box-shadow: 0 8px 18px rgb(15 23 42 / 20%);
  letter-spacing: -0.15px;
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: 600;
  line-height: 18px;
  text-align: center;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  color: color-mix(in srgb, var(--foreground) 40%, var(--muted-foreground));
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  font-family: var(--font-sans);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 1;
}

small,
.text-small {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {

/* Match inline alignment without overriding a containing flex or grid layout. */
.btn,
.nav-link,
.form-control,
.form-select,
.form-range,
.form-check {
  vertical-align: middle;
}

.btn,
.nav-link {
  appearance: button;

  max-inline-size: 100%;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;

  user-select: none;

  font-family: var(--font-sans);
  height: fit-content;
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  padding-inline: var(--control-spacing, 12px);
  border-color: transparent;
  border-radius: var(--radius-full);
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 18px;
}

.btn {
  border-color: var(--border);
  color: var(--secondary-foreground);

.btn:is(.btn-block, .viz-tile) {

}

.btn.viz-tile {
  min-width: 0;

a.btn {

}

.btn:not(:disabled):hover {
  background: light-dark(
    color-mix(in srgb, var(--foreground) 5.5%, transparent),
    color-mix(in srgb, var(--foreground) 8%, transparent)
  );

.nav-link:not(:disabled):not([aria-disabled="true"]):hover {

}

.btn-primary {
  border-color: var(--border);
  color: var(--primary-foreground);
  background: var(--foreground);

}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

}

.btn-ghost {
  border-color: transparent;

.btn-ghost:not(:disabled):hover {
  color: var(--muted-foreground);
  background: light-dark(

.nav-pills .nav-link {

.nav-justified .nav-link {

.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,

}

.viz-carousel {

}

.viz-carousel > [data-variant][hidden] {

}

.viz-carousel > [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {

  bottom: 8px;

  border-radius: 16px;
  color: var(--foreground);

  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;

  isolation: isolate;
}

.viz-carousel-controls > button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;

function prepareTicketImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Unable to read image'));
    reader.onload=()=>{
      const image=new Image();
      image.onerror=()=>reject(new Error('Unable to process image'));
      image.onload=()=>{
        const maxSide=1200,scale=Math.min(1,maxSide/Math.max(image.naturalWidth,image.naturalHeight));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
        canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
        canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',.82));
      };
      image.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function centerCarouselCard(targetIndex, smooth = true, isSpinning = false) {
  const viewport = main.querySelector('.prize-carousel-viewport');
  const track = main.querySelector('#prize-carousel-track');
  if(!viewport || !track) return;
  const cards = track.querySelectorAll('.prize-carousel-card');
  if(!cards || cards.length === 0) return;
  
  currentCardIndex = Math.max(0, Math.min(targetIndex, cards.length - 1));
  const cardW = 270;
  const gap = 14;
  const pitch = cardW + gap;
  const vpWidth = viewport.offsetWidth || 428;
  const centerOffset = (vpWidth - cardW) / 2;
  const x = centerOffset - (currentCardIndex * pitch);
  
  if(isSpinning) {
    track.classList.add('is-spinning');
    track.style.setProperty('transition', 'transform 3.8s cubic-bezier(0.12, 0.9, 0.18, 1)', 'important');
    cards.forEach(c => c.classList.remove('active'));
    
    setTimeout(() => {
      track.classList.remove('is-spinning');
      track.style.removeProperty('transition');
      const winningCard = cards[currentCardIndex];
      if(winningCard) winningCard.classList.add('active');
    }, 3800);
  } else if(smooth) {
    track.style.transition = 'transform 0.35s cubic-bezier(0.2, 0, 0.2, 1)';
    cards.forEach((c, idx) => {
      c.classList.toggle('active', idx === currentCardIndex);
    });
  } else {
    track.style.transition = 'none';
    cards.forEach((c, idx) => {
      c.classList.toggle('active', idx === currentCardIndex);
    });
  }
  track.style.transform = 'translateX(' + x + 'px)';
}

}

  }

  function createConfetti(count = 75) {

      confetti.push({
        x: Math.random() * width,

        vx: (Math.random() - 0.5) * 2.2,

        vRot: (Math.random() - 0.5) * 7,
        w: Math.random() * 9 + 6,
        h: Math.random() * 5 + 4,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }

  for(let i = 0; i < 4; i++) {
    setTimeout(() => {
      if(!active) return;
      createBurst(width * 0.2 + Math.random() * (width * 0.6), height * 0.16 + Math.random() * (height * 0.22), 52);
    }, i * 280);
  }
  createConfetti(85);

  const onPointerDown = e => {
    if(e.target.closest('button')) return;
    const rect = canvas.getBoundingClientRect();
    createBurst(e.clientX - rect.left, e.clientY - rect.top, 42);
  };
  main.addEventListener('pointerdown', onPointerDown);

  function loop() {
    if(!active) return;
    ctx.clearRect(0, 0, width, height);

    for(let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.98;
      p.alpha -= p.decay;
      if(p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for(let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.x += c.vx;
      c.y += c.vy;
      c.rot += c.vRot;
      if(c.y > height + 20) {
        c.y = -10;
        c.x = Math.random() * width;
      }
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate((c.rot * Math.PI) / 180);
      ctx.fillStyle = c.color;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  return () => {
    active = false;
    main.removeEventListener('pointerdown', onPointerDown);
  };
}

  }
  if(screen==='done')content=`<div class="center"><div class="emblem"><svg viewBox="0 0 112 104" role="img" aria-label="Claim confirmed"><circle cx="56" cy="53" r="37" fill="#dff5b8"/><path d="m38 53 12 12 25-26" fill="none" stroke="#173d34" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M91 7v12M85 13h12" stroke="#b7e98b" stroke-width="4" stroke-linecap="round"/><path d="m18 25 3 3m0-3-3 3M89 78l3 3m0-3-3 3" stroke="#a8df84" stroke-width="4" stroke-linecap="round"/></svg></div><h1>${t.done.title}</h1><p>${t.done.desc}</p><div class="reward" style="padding:18px"><div class="confirmation-card-brand"><img src="v1-logo-extracted.png" alt="Vital Premium Water"><span>PRIZE TICKET</span></div><img src="${wheelItems.find(item=>item.id===currentPrize)?.wheelImg||p.img}" alt="${p.name}" style="width:100%;height:260px;object-fit:cover;border-radius:14px;margin-bottom:12px;border:1.5px solid #38bdf8" onerror="this.onerror=null;this.src='prize-foldable.png';"><small>${t.done.yourPrize}</small><h2>${p.name}</h2><dl class="confirmation-claim-details"><div><dt>${isKm?'ឈ្មោះពេញ':'Full Name'}</dt><dd>${escapeClaimText(claimedContact.name||'—')}</dd></div><div><dt>${isKm?'លេខទូរស័ព្ទ':'Phone Number'}</dt><dd>${escapeClaimText(claimedContact.phone||'—')}</dd></div><div><dt><span>${isKm?'កូដ QR លើដប':'Bottle QR Code'}</span></dt><dd><img class="confirmation-bottle-qr" src="wheel-assets/bottle-qr.svg" alt="Bottle QR code"></dd></div></dl></div><div class="confirmation-actions"><button type="button" class="primary save-prize-btn cursor-interaction" data-save-prize>${icon('download')}<span class="save-prize-label">${t.done.savePrize}</span></button><button type="button" class="secondary cursor-interaction" data-screen="scan">${icon('scan-line')}<span>${t.done.btnAnother}</span></button></div></div>`;

  const screenActions=actionSelector?main.querySelector(actionSelector):null;
  if(screenActions){
    const dock=document.createElement('div');dock.className='screen-action-dock';dock.dataset.screen=screen;

      }
      setTimeout(() => {
        const gift = main.querySelector('#win-gift-wrap');
        if(gift) gift.style.display = 'none';
      }, 850);
    });
  }
  
  if(screen==='spin'){
    requestAnimationFrame(() => {
      centerCarouselCard(currentCardIndex, false);
      
      const vp = main.querySelector('.prize-carousel-viewport');
      if(vp) {
        let touchStart = 0;
        vp.addEventListener('touchstart', e => {
          touchStart = e.touches[0].clientX;
        }, { passive: true });
        vp.addEventListener('touchend', e => {
          const diff = e.changedTouches[0].clientX - touchStart;
          if(diff < -35) {
            centerCarouselCard(currentCardIndex + 1, true);
            syncOutcomeToCurrentCard();
          } else if(diff > 35) {
            centerCarouselCard(currentCardIndex - 1, true);
            syncOutcomeToCurrentCard();
          }
        }, { passive: true });
      }
    });
  }
  
  if(screen==='scan'){
    const frame=main.querySelector('#scanner-frame'),badge=root.querySelector('#scan-badge');

        badge.classList.add('detected');

      const enabled=control.getAttribute('aria-pressed')!=='true';
      control.setAttribute('aria-pressed',String(enabled));

    }));
  }
}

function go(screen,isBack=false){if(!isBack&&screen!==current){historyStack.push(current);}render(screen,isBack);if(main)main.scrollTop=0;window.openai?.setWidgetState?.({modelContent:{brand:'Vital',flow:'Web scan, spin, result, winner details, confirmation',screen,branding:'Modern Vital blue with subtle red accents'},privateContent:{screen}})?.catch(()=>{});}
function goBack(){let target=historyStack.pop();while(target===current&&historyStack.length>0){target=historyStack.pop();}if(!target||target===current){target=prevScreenMap[current]||'scan';}if(target&&target!==current){go(target,true);}}

root.addEventListener('click',async e=>{
  const themeToggle=e.target.closest('[data-toggle-win-theme]');
  if(themeToggle){whiteWinTheme=!whiteWinTheme;main.classList.toggle('win-theme-white',whiteWinTheme);themeToggle.setAttribute('aria-pressed',String(whiteWinTheme));return;}
  const sampleTicket=e.target.closest('#btnUseSamplePhoto');
  if(sampleTicket){
    e.preventDefault();
    pendingTicketImage='prize-cap.jpg';
    const preview=main.querySelector('#bottlePhotoPreview'),empty=main.querySelector('#bottlePhotoEmpty'),img=main.querySelector('#bottlePhotoImg');
    if(img)img.src='prize-cap.jpg';
    if(preview)preview.classList.add('is-active');
    if(empty)empty.style.display='none';
    return;
  }
  const savePrize=e.target.closest('[data-save-prize]');
  if(savePrize){
    savePrize.disabled=true;
    try{
      await downloadPrizeTicket();
      if(pendingTicketImage)saveTicketImage(pendingTicketImage);
      savePrize.querySelector('.save-prize-label').textContent=v1Translations[v1Lang].done.prizeSaved;
      savePrize.classList.add('is-saved');
    }catch(error){
      savePrize.querySelector('.save-prize-label').textContent=v1Lang==='km'?'ព្យាយាមម្តងទៀត':'Try saving again';
    }finally{savePrize.disabled=false;}
    return;
  }
  const ticketUpload=e.target.closest('#bottlePhotoDropZone');
  if(ticketUpload&&!e.target.closest('#bottlePhotoInput')){
    e.preventDefault();
    main.querySelector('#bottlePhotoInput')?.click();
    return;
  }
  if(e.target.closest('[data-open-terms]')){main.querySelector('.spin-terms-dialog')?.showModal();return;}
  const showDepots=e.target.closest('[data-show-depots]');
  if(showDepots){
    const modal=root.querySelector('[data-depot-modal]');
    if(modal)modal.classList.add('is-open');
    return;
  }
  const closeDepots=e.target.closest('[data-close-depots]');
  const depotBackdrop=e.target.matches?.('[data-depot-modal]')?e.target:null;
  if(closeDepots||depotBackdrop){
    const modal=root.querySelector('[data-depot-modal]');
    if(modal)modal.classList.remove('is-open');
    return;
  }
  const spin=e.target.closest('[data-spin]');
  if(spin){
    if(spin.disabled) return;
    spin.disabled=true;
    spin.classList.add('spinning');
    
    let itemIdx = wheelItems.findIndex(w => w.id === selected);
    if(itemIdx < 0) itemIdx = 0;
    const deg = 1800 - (itemIdx * (360 / wheelItems.length));
    
    const plate=main.querySelector('#wheel-plate');
    if(plate)plate.style.transform=`rotate(${deg}deg)`;
    
    const curMod = currentCardIndex % wheelItems.length;
    const stepDiff = ((itemIdx - curMod) + wheelItems.length) % wheelItems.length;
    const targetCardIdx = currentCardIndex + wheelItems.length * 2 + stepDiff;
    centerCarouselCard(targetCardIdx, true, true);
    
    const dur=window.matchMedia('(prefers-reduced-motion:reduce)').matches?100:4100;
    timer=setTimeout(()=>{
      if(selected==='lose'||selected==='lose-1'||selected==='lose-2'){
        go('lose');
      }else{
        currentPrize=selected;
        go('win');
      }
    },dur);
    return;
  }

  const langBtnClicked=e.target.closest('#app-lang-btn');
  if(langBtnClicked){
    e.preventDefault();
    v1Lang = (v1Lang === 'en') ? 'km' : 'en';
    document.documentElement.lang = v1Lang;
    const t = v1Translations[v1Lang];
    const txtLang = langBtnClicked.querySelector('#txtV1Lang');
    if(txtLang) txtLang.textContent = t.langBtn;
    langBtnClicked.setAttribute('title', t.langTitle);
    langBtnClicked.setAttribute('aria-label', t.langTitle);
    updateBackButton(current);
    render(current);
    return;
  }

  const back=e.target.closest('#app-back-btn') || e.target.closest('#win-back-btn');
  if(back){e.preventDefault();goBack();return;}

  const card=e.target.closest('.prize-carousel-card');
  if(card){
    const cardIdx = parseInt(card.dataset.cardIdx, 10);
    const prizeId = card.dataset.prizeId;
    centerCarouselCard(cardIdx, true);
    if(prizeId) selected = prizeId;
    return;
  }

  const nav=e.target.closest('button[data-screen], a[data-screen]');
  if(nav){const to=nav.dataset.screen;if(to===prevScreenMap[current]||(historyStack.length>0&&historyStack[historyStack.length-1]===to)){go(to,true);}else{go(to);}return;}
});


root.addEventListener('change', async e => {
  if(e.target?.id==='claimTerms'){
    const submit=root.querySelector('[data-claim-submit]');
    if(submit)submit.disabled=!e.target.checked;
  }
  if (e.target && e.target.id === 'bottlePhotoInput') {
    const file = e.target.files && e.target.files[0];

      try{
        const ticketImage=await prepareTicketImage(file);
        const preview = main.querySelector('#bottlePhotoPreview');
        const empty = main.querySelector('#bottlePhotoEmpty');
        const img = main.querySelector('#bottlePhotoImg');
        const err=main.querySelector('.claim-submit-area .err');
        pendingTicketImage=ticketImage;
        if(err)err.textContent='';
        if (img) img.src = ticketImage;
        if (preview) preview.classList.add('is-active');
        if (empty) empty.style.display = 'none';
      }catch(error){
        const err=main.querySelector('.claim-submit-area .err');
        if(err)err.textContent=v1Lang==='km'?'សូមជ្រើសរើសឯកសាររូបភាពដែលត្រឹមត្រូវ។':'Please choose a valid image file.';
      }
    }
  }
});

root.addEventListener('submit',e=>{
  if(e.target.method==='dialog')return;
  e.preventDefault();const form=e.target,err=form.querySelector('.err');
  const t = v1Translations[v1Lang];
  if(form.dataset.form==='info'){
    const name=form.elements.name.value.trim(),phone=form.elements.phone.value.replace(/[\s()+-]/g,''),termsAccepted=form.elements.claimTerms?.checked;
    if(!name||!/^\d{8,15}$/.test(phone)){err.textContent=t.info.errValidation;return;}
    if(!termsAccepted){err.textContent=v1Lang==='km'?'សូមយល់ព្រមតាមលក្ខខណ្ឌមុនពេលដាក់ស្នើ។':'Please agree to the Terms and Conditions before submitting.';return;}
    claimedContact={name,phone:form.elements.phone.value.trim()};
    go('done');
  }
});

window.addEventListener('openai:set_globals',e=>{
  const screen=e.detail?.globals?.widgetState?.privateContent?.screen;
  if(allowed.includes(screen)&&screen!==current)render(screen);
});
render(current);
})();

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };

    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }

  };

      return;
    }

      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }

      closeTooltip();
    }
  };

    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">
  (() => {
    for (const root of document.querySelectorAll(".viz-carousel")) {
      const panels = Array.from(
        root.querySelectorAll(":scope > [data-variant]"),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute("role", "group");
      panels.forEach((panel, index) => {
        panel.hidden = index !== 0;
        panel.setAttribute("role", "group");
        if (!panel.hasAttribute("aria-label")) {
          panel.setAttribute("aria-label", panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement("div");
      controls.className = "viz-carousel-controls";
      // Portable copy of the settings dropdown's legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      <button type="button" class="viz-carousel-previous cursor-interaction"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <details class="viz-carousel-picker">
        <summary class="cursor-interaction">
          <span class="viz-carousel-count tabular-nums"></span>
          <span class="viz-carousel-name"></span>
          <svg class="viz-carousel-caret" width="14" height="14" viewBox="0 0 20 21" fill="none" aria-hidden="true" focusable="false">
            <path d="M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" />
          </svg>
        </summary>
        <div class="viz-carousel-options"></div>
      </details>
      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
      const previous = controls.querySelector(".viz-carousel-previous");
      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");
      const count = controls.querySelector(".viz-carousel-count");
      const name = controls.querySelector(".viz-carousel-name");
      const options = controls.querySelector(".viz-carousel-options");
      const status = document.createElement("span");
      status.className = "sr-only";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-atomic", "true");
      previous.setAttribute(
        "aria-label",
        root.dataset.previousLabel ?? "Previous variant",
      );
      next.setAttribute("aria-label", root.dataset.nextLabel ?? "Next variant");

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener("pointerdown", (event) => {
        summaryPointerHandled =
          event.pointerType === "mouse" && event.button === 0 && !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener("click", (event) => {
        if (summaryPointerHandled && event.detail > 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) => {
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "cursor-interaction";
        choice.textContent = panel.dataset.variant;
        choice.addEventListener("click", () => {
          select(index);
          summary.focus();
        });
        choice.addEventListener("pointerup", (event) => {
          if (
            picker.open &&
            event.pointerType === "mouse" &&
            event.button === 0 &&
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) => {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) => {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            "aria-current",
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),
      );
      picker.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
